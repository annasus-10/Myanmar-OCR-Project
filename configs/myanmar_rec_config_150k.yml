Global:
  use_gpu: true
  epoch_num: 25
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: /home/jupyter-st126316/Myanmar-OCR-Project/outputs/puffer_2080ti_150k
  save_epoch_step: 3
  eval_batch_step:
  - 0
  - 2000
  cal_metric_during_train: true
  pretrained_model: null
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: doc/imgs_words_en/word_10.png
  character_dict_path: /home/jupyter-st126316/Myanmar-OCR-Project/data/chn_subset/myanmar_dict.txt
  max_text_length: 25
  infer_mode: false
  use_space_char: true
  save_res_path: ./output/rec/predicts_mv3_none_bilstm_ctc.txt
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    learning_rate: 0.0005
  regularizer:
    name: L2
    factor: 0
Architecture:
  model_type: rec
  algorithm: CRNN
  Transform: null
  Backbone:
    name: MobileNetV3
    scale: 0.5
    model_name: large
  Neck:
    name: SequenceEncoder
    encoder_type: rnn
    hidden_size: 96
  Head:
    name: CTCHead
    fc_decay: 0
Loss:
  name: CTCLoss
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/jupyter-st126316/Myanmar-OCR-Project/data/chn_subset
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 32
        - 100
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
    label_file_list:
    - /home/jupyter-st126316/Myanmar-OCR-Project/data/chn_subset/rec_gt_train.txt
  loader:
    shuffle: false
    batch_size_per_card: 32
    drop_last: true
    num_workers: 8
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/jupyter-st126316/Myanmar-OCR-Project/data/chn_subset
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - CTCLabelEncode: null
    - RecResizeImg:
        image_shape:
        - 3
        - 32
        - 100
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
    label_file_list:
    - /home/jupyter-st126316/Myanmar-OCR-Project/data/chn_subset/rec_gt_test.txt
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
